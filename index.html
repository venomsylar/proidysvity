<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пройдисвіти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Pangolin&family=Rubik:wght@400;500;700&family=Underdog&display=swap">
<link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
<div id="scene"></div>
<div id="ui">
  <div class="topbar" id="topbar">
    <div class="brand">Пройдисвіти<button class="ver" id="btnVer" type="button" title="Що нового">v?</button><small>настільна гра в підземеллі</small></div>
    <div class="top-actions">
      <button class="btn small" id="btnSound" type="button">Звук</button>
      <button class="btn small" id="btnSkin" type="button">Стіл</button>
      <button class="btn small" id="btnRules" type="button">Правила</button>
      <button class="btn small" id="btnLog" type="button">Журнал</button>
      <button class="btn small" id="btnNew" type="button">Нова гра</button>
    </div>
  </div>
  <div class="middle">
    <aside class="board" id="players" aria-label="Табло рівнів"></aside>
    <div class="side">
      <section class="combat" id="combat" hidden></section>
      <aside class="log" id="log"><header><span>Журнал</span><button class="btn small ghost" id="btnLogClose" type="button">Сховати</button></header><ol id="logList"></ol></aside>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="banner" id="banner" aria-hidden="true"></div>
  </div>
  <div class="dock" id="dock">
    <div class="dock-head">
      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="dock-body">
      <div>
        <div class="lbl">Персонаж <span id="strText"></span><button class="linkbtn" type="button" data-sheet>Картка персонажа</button></div>
        <div class="equip" id="equip"></div>
      </div>
      <div>
        <div class="lbl">Рука <span id="handOwner"></span></div>
        <div class="hand" id="hand"></div>
      </div>
    </div>
  </div>
</div>
<div class="menu" id="menu" hidden></div>
<div class="peek" id="peek" hidden aria-hidden="true"></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/version.js?v=21"></script>
<script src="js/utils.js?v=21"></script>
<script src="js/cards.js?v=21"></script>
<script src="js/state.js?v=21"></script>
<script src="js/scene3d.js?v=21"></script>
<script src="js/sound.js?v=21"></script>
<script src="js/game.js?v=21"></script>
<script src="js/actions.js?v=21"></script>
<script src="js/net.js?v=21"></script>
<script src="js/ui.js?v=21"></script>
<script src="js/main.js?v=21"></script>
</body>
</html>
