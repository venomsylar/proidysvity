<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пройдисвіти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Pangolin&family=Rubik:wght@400;500;700&family=Underdog&display=swap">
<style>
/* Layout: full-bleed 3D tavern table; HUD floats above it — players strip on top, combat scoreboard centre, hand dock at the bottom. */
:root{
  --bg:#0f0b0a; --panel:rgba(24,17,14,.88); --panel-solid:#1b1310; --raise:#2a1e18; --raise-2:#3a2a20;
  --line:rgba(224,169,59,.26); --text:#f3e9d8; --muted:#b9a891;
  --brass:#e0a93b; --door:#9b2f55; --treasure:#b07c1c; --good:#7fd081; --bad:#ef6b5d;
  --paper:#efe8dc; --ink:#1b1512;
  --f-display:'Underdog','Comic Sans MS',cursive;
  --f-card:'Pangolin','Comic Sans MS',cursive;
  --f-ui:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px)}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}
.brand{pointer-events:auto;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--brass);text-shadow:0 2px 0 #000,0 0 18px rgba(224,169,59,.35);white-space:nowrap;padding-top:8px}
.brand small{display:block;font-family:var(--f-ui);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:4px}
.board{pointer-events:auto;grid-area:board;align-self:start;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.bhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 2px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bhead b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:0;text-transform:none;color:var(--brass)}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:10px;border:1px solid transparent;border-left:4px solid var(--pc);background:rgba(255,255,255,.025);cursor:pointer;transition:background .2s,border-color .2s,box-shadow .3s}
.brow:hover{background:rgba(255,255,255,.06)}
.brow:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.brow.cur{border-color:var(--pc);border-left-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 22px -2px var(--pc);background:rgba(255,255,255,.07)}
.brow.cur .bt{color:var(--pc)}
.blvl{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--pc);text-align:center;font-variant-numeric:tabular-nums}
.bname{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:13.5px;min-width:0}
.bname .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname em{font-style:normal;font-weight:500;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bname .bt{margin-left:auto;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700;white-space:nowrap}
.bname .bs{font-size:12px;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.bname .bt[hidden] + .bs{margin-left:auto}
.track{display:flex;gap:2px;align-items:center;margin:5px 0 4px}
.track i{flex:1;height:9px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s}
.track i.ep{background:rgba(239,107,93,.16)}
.track i.on{background:var(--pc)}
.track i.ep.on{background:var(--pc);box-shadow:inset 0 0 0 1px rgba(255,90,70,.9)}
.track i.fin{box-shadow:0 0 0 1px var(--brass)}
.track b{width:5px;flex:0 0 5px}
.track i.pop{animation:pip .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pip{0%{transform:scaleY(.2);filter:brightness(2.5)}60%{transform:scaleY(1.9);filter:brightness(1.8)}100%{transform:none;filter:none}}
.bmeta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.up{animation:rowup 1s ease-out}
.brow.down{animation:rowdown 1s ease-out}
.brow.up .blvl,.brow.down .blvl{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes rowup{0%{background:rgba(127,208,129,.35)}100%{background:rgba(255,255,255,.025)}}
@keyframes rowdown{0%{background:rgba(239,107,93,.4)}100%{background:rgba(255,255,255,.025)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.btn{pointer-events:auto;border:1px solid var(--line);background:var(--raise);color:var(--text);padding:9px 14px;border-radius:9px;font-weight:500;font-size:14px;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;white-space:nowrap;line-height:1.2}
.btn:hover:not(:disabled){background:var(--raise-2);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:linear-gradient(#f2c25c,#c98d22);color:#23170b;border-color:#f7d68a;font-weight:700;box-shadow:0 3px 0 #7d5412,0 0 18px rgba(224,169,59,.3)}
.btn.primary:hover:not(:disabled){background:linear-gradient(#f7cf73,#d49a2c)}
.btn.primary.pulse:not(:disabled){animation:glow 1.8s ease-in-out infinite}
.btn.danger{background:#5b221c;border-color:#a8473c}
.btn.danger:hover:not(:disabled){background:#702a22}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
@keyframes glow{0%,100%{box-shadow:0 3px 0 #7d5412,0 0 10px rgba(224,169,59,.25)}50%{box-shadow:0 3px 0 #7d5412,0 0 26px rgba(224,169,59,.65)}}

.middle{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr) minmax(0,310px);grid-template-areas:"board . side";grid-template-rows:minmax(0,100%);gap:12px;align-items:start;position:relative}
.side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0;max-height:100%}
.combat{pointer-events:auto;background:var(--panel);border:1px solid rgba(224,169,59,.55);border-radius:14px;padding:10px 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px 14px;align-items:center;width:100%;flex:0 0 auto;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
.cside{min-width:0}
.cside .cl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cside .big{font-family:var(--f-display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.cside.hero .big{color:var(--good)}
.cside.mon{text-align:right}
.cside.mon .big{color:var(--bad)}
.vs{font-family:var(--f-display);font-size:15px;color:var(--brass);text-align:center;line-height:1.1}
.vs b{display:block;font-size:24px}
.cbar{grid-column:1 / -1;height:8px;border-radius:99px;background:rgba(239,107,93,.75);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--good);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.cmods{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.tag.m{border-color:rgba(239,107,93,.5)} .tag.h{border-color:rgba(127,208,129,.5)}
.cnote{grid-column:1 / -1;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.4}
.cnote b{color:var(--text);font-weight:500}
.crow{grid-column:1 / -1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
@keyframes drop{from{transform:translateY(-24px) scale(.96);opacity:0}to{transform:none;opacity:1}}

.toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);pointer-events:none;background:rgba(15,10,8,.92);border:1px solid var(--brass);color:var(--text);padding:12px 20px;border-radius:12px;font-family:var(--f-display);font-size:20px;text-align:center;max-width:min(520px,100%);opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1.02)}
.banner{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%) scale(.8);pointer-events:none;padding:10px 26px;border-radius:14px;background:rgba(15,10,8,.86);border:2px solid var(--bc,var(--brass));color:var(--bc,var(--brass));font-family:var(--f-display);font-size:30px;white-space:nowrap;opacity:0;box-shadow:0 0 30px -4px var(--bc,var(--brass));transition:opacity .3s,transform .4s cubic-bezier(.2,1.5,.4,1)}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ctimer{grid-column:1 / -1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.ctimer i{display:block;height:100%;background:var(--brass);animation:drain linear forwards}
@keyframes drain{to{width:0}}

.log{pointer-events:auto;width:100%;min-height:90px;max-height:38vh;flex:0 1 auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.log header{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.log ol{list-style:none;margin:0;padding:6px 10px 8px;overflow-y:auto;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column;gap:3px}
.log li.turn{margin-top:4px;color:var(--brass);font-weight:500}
.log[hidden]{display:none!important}

.dock{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.dock-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{flex:1;min-width:200px;font-size:14px;line-height:1.35;min-height:2.7em}
.status b{color:var(--brass);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;min-height:38px;align-items:center}
.dock-body{display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr);gap:14px;align-items:start}
.lbl{min-height:20px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lbl span{letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--text)}
.equip{margin-top:6px;min-height:162px}
.dock-body > div:first-child .lbl{min-height:37px;align-items:flex-start}
.linkbtn{background:none;border:0;padding:0;color:var(--brass);font:500 11.5px var(--f-ui);letter-spacing:.02em;text-transform:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.doll{--s:50px;position:relative;display:grid;width:max-content;grid-template-columns:repeat(3,var(--s));grid-auto-rows:var(--s);grid-template-areas:"race head cls" "lh body rh" "misc feet pow";gap:6px}
.doll.big{--s:92px;gap:10px;margin:0 auto}
.doll .sil{position:absolute;left:50%;top:50%;width:calc(var(--s)*2.3);height:calc(var(--s)*3.3);transform:translate(-50%,-50%);fill:none;stroke:rgba(224,169,59,.13);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.slot{position:relative;z-index:1;border-radius:10px;border:1px solid var(--line);background:rgba(42,30,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;color:var(--text);font:inherit;min-width:0;overflow:hidden}
button.slot{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
button.slot:hover{transform:translateY(-2px);border-color:var(--brass);box-shadow:0 6px 14px rgba(0,0,0,.4)}
button.slot:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.slot.empty{background:rgba(18,13,11,.6);border-style:dashed}
.slot .se{font-size:calc(var(--s)*.46);line-height:1;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.doll.big .slot .se{font-size:calc(var(--s)*.36)}
.slot .sl{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.1}
.doll.big .slot .sl{font-size:10px}
.slot .sn{font-size:11px;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .sb{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.doll.big .slot .sb{top:4px;bottom:auto;font-size:12.5px}
.slot .cnt{position:absolute;left:4px;top:3px;font-size:10px;font-weight:700;color:var(--brass)}
.slot.rc{border-color:rgba(224,169,59,.6);background:rgba(60,40,22,.94)}
.slot.off .se{filter:grayscale(1);opacity:.45}
.slot.off .sb{color:var(--muted);text-decoration:line-through}
.slot.twin{border-style:dashed;opacity:.6}
.slot.power{background:linear-gradient(#3a2a20,#221812);border-color:var(--brass)}
.slot .pv{font-family:var(--f-display);font-size:calc(var(--s)*.5);color:var(--good);line-height:1;font-variant-numeric:tabular-nums}
.char-btn{display:none}
.sheet.wide{width:min(780px,100%)}
.cs-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.cs-head h2{margin:0}
.cs-lvl{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--pc);min-width:1.4em;text-align:center;border:2px solid var(--pc);border-radius:14px;padding:6px 8px 4px}
.cs-lvl small{display:block;font-family:var(--f-ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cs-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.cs-grid h3:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(224,169,59,.16);font-size:13.5px}
.kv b{font-variant-numeric:tabular-nums;color:var(--good);white-space:nowrap}
.kv.off span{color:var(--muted);text-decoration:line-through}
.kv.off b{color:var(--muted)}
.kv.total{border-bottom:0;font-weight:700;font-size:15px}
.kv.total b{font-family:var(--f-display);font-size:24px;font-weight:400}
.meter{height:7px;border-radius:99px;background:var(--raise);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--brass)}
.ability{font-size:13px;line-height:1.45;margin:0 0 6px}
.ability b{color:var(--brass);font-weight:500}
.misc-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}
.misc-list .tag{cursor:pointer}
.empty{font-size:12.5px;color:var(--muted);padding:6px 0}
.hand-cover{display:flex;gap:18px;align-items:center;padding:12px 4px 6px;min-height:120px}
.hand-cover .backs{display:flex;padding-left:24px;flex:0 0 auto}
.hand-cover .backs i{width:58px;height:82px;border-radius:7px;background:linear-gradient(135deg,#6e1d40,#3d0f24);border:2px solid var(--brass);margin-left:-24px;box-shadow:0 6px 12px rgba(0,0,0,.45)}
.hand-cover .backs i:nth-child(2n){background:linear-gradient(135deg,#b4801f,#6d4610)}
@media (max-width:560px){ .hand-cover .backs{display:none} }
.hand{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:14px 4px 6px;scrollbar-width:thin;min-height:178px;align-items:flex-start}

.card{--k:1;flex:0 0 auto;position:relative;width:calc(108px*var(--k));aspect-ratio:5/7;background:var(--paper);color:var(--ink);border-radius:calc(9px*var(--k));border:calc(2px*var(--k)) solid var(--ink);box-shadow:0 0 0 calc(3px*var(--k)) var(--paper),0 8px 16px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:calc(5px*var(--k));gap:calc(2px*var(--k));cursor:pointer;font-family:var(--f-card);overflow:hidden;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s;margin:3px}
.card:hover{transform:translateY(-10px) rotate(-1.5deg)}
.card:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.card.playable{box-shadow:0 0 0 calc(3px*var(--k)) var(--paper),0 0 0 calc(6px*var(--k)) var(--brass),0 8px 18px rgba(224,169,59,.35)}
.card .band{display:flex;justify-content:space-between;align-items:center;border-radius:calc(5px*var(--k));padding:calc(2px*var(--k)) calc(6px*var(--k));font:700 calc(8.5px*var(--k))/1.35 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#fff4e0}
.card .band b{font-family:var(--f-display);font-size:calc(13px*var(--k));letter-spacing:0;font-weight:400}
.card.door .band{background:#8a2650}
.card.treasure .band{background:#a8741a}
.card .nm{font-family:var(--f-display);font-size:calc(12.5px*var(--k));line-height:1.05;text-align:center;min-height:2.15em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.card .art{font-size:calc(36px*var(--k));text-align:center;line-height:1.2;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.card .tx{font-size:calc(10px*var(--k));line-height:1.18;text-align:center;flex:1;overflow:hidden}
.card .tx i{display:none}
.card .mtype{align-self:center;margin-top:calc(-5px*var(--k));padding:calc(1px*var(--k)) calc(7px*var(--k));border-radius:99px;font:700 calc(8px*var(--k))/1.3 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;background:#6b5642;color:#fff4e0;border:calc(1.5px*var(--k)) solid #e6d6bf;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.card .mtype.und{background:#2d5a46;color:#e4fff0;border-color:#9fe0bd}
.lbl .hc{font-weight:700} .lbl .hc.over{color:#ef6b5d}
.card .ft{display:flex;justify-content:space-between;gap:4px;font:700 calc(8.5px*var(--k)) var(--f-ui);border-top:calc(1.5px*var(--k)) dashed rgba(27,21,18,.35);padding-top:calc(2px*var(--k))}
.card.big{--k:2.1;cursor:default;aspect-ratio:auto;min-height:calc(151px*var(--k))}
.card.big:hover{transform:none}
.card.big .tx i{display:block;margin-top:.5em;color:#5d4a3d}
.card.fresh{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:translateY(-70px) scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}

.modal{position:fixed;inset:0;z-index:30;pointer-events:auto;background:rgba(8,5,4,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;width:min(580px,100%);max-height:calc(100dvh - 40px);overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;color:var(--brass);margin:0 0 8px;text-wrap:balance}
.sheet h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:500}
.sheet p{margin:0 0 10px;line-height:1.5;color:var(--text);max-width:65ch}
.sheet ul{margin:0 0 10px;padding-left:20px;line-height:1.5}
.sheet li{margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.end{justify-content:flex-end}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list .btn{text-align:left;white-space:normal}
.prow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:8px}
.pctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.inp.sel{width:auto;padding:7px 8px;font-size:13px}
.seg button:disabled{opacity:.5;cursor:default}
.netcode{display:flex;align-items:baseline;gap:12px;padding:10px 14px;border:1px dashed var(--brass);border-radius:12px;background:rgba(224,169,59,.06)}
.netcode span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.netcode b{font-family:var(--f-display);font-weight:400;font-size:36px;letter-spacing:.12em;color:var(--brass)}
.lbl2{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.inp.code{font-family:var(--f-display);font-size:26px;letter-spacing:.2em;text-transform:uppercase;max-width:220px}
.ochips{display:flex;flex-wrap:wrap;gap:6px}
.range{width:100%;accent-color:var(--brass);height:28px;cursor:pointer}
.range:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:inherit;cursor:pointer;text-align:center;transition:border-color .15s,transform .15s}
.skin:hover{transform:translateY(-2px)}
.skin:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.skin[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 18px rgba(224,169,59,.3)}
.skin .sw{width:72px;height:72px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.4)}
.skin b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--brass)}
.skin small{font-size:12px;color:var(--muted);line-height:1.35}
.ochip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--raise);color:var(--text);cursor:pointer}
.ochip[aria-pressed="true"]{background:var(--brass);color:#23170b;border-color:var(--brass);font-weight:700}
.ochip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.peek{position:fixed;z-index:15;pointer-events:none;transform-origin:top left;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.peek .card{--k:1.6;margin:0}
.bname .btype{font-style:normal;font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:560px){ .prow{grid-template-columns:12px minmax(0,1fr) auto} .prow > [data-del]{grid-column:3;grid-row:1} .pctl{grid-column:2 / 4;grid-row:2;justify-content:flex-start} }
.prow .dot{width:12px;height:12px;border-radius:50%}
.inp{background:#120d0b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.inp:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#23170b;font-weight:700}
.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.hint{font-size:12.5px;color:var(--muted)}

.menu{position:fixed;inset:0;z-index:25;pointer-events:auto;background:rgba(8,5,4,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px}
.menu-inner{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%;animation:rise .3s cubic-bezier(.2,1.2,.4,1)}
.menu-acts{display:flex;flex-direction:column;gap:8px;min-width:200px;max-width:280px}
.menu-acts .why{font-size:12px;color:var(--muted);margin-top:-4px}
.curtain{text-align:center}
.curtain .who{font-family:var(--f-display);font-size:44px;margin:10px 0 4px}

@media (max-width:760px){
  .brand{font-size:22px;padding-top:4px}
  .brand small{display:none}
  .top-actions .btn{padding:7px 9px;font-size:12px}
  .middle{display:flex;flex-direction:column;align-items:stretch;gap:8px}
  .board{flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;padding:6px;gap:6px;flex:0 0 auto}
  .bhead{display:none}
  .brow{flex:0 0 auto;width:156px;grid-template-columns:30px minmax(0,1fr);gap:6px;padding:5px 7px}
  .blvl{font-size:24px}
  .bname{font-size:12px}
  .bname .bs,.bname .bt{display:none}
  .track{gap:1px;margin:3px 0 2px}
  .track i{height:6px}
  .track b{width:3px;flex-basis:3px}
  .bmeta{font-size:10px}
  .side{margin-top:auto;max-height:none}
  .log{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 250px);max-height:30vh;z-index:5}
  .dock-body{grid-template-columns:minmax(0,1fr);gap:4px}
  .equip .doll{display:none}
  .char-btn{display:inline-flex}
  .equip{margin-top:4px;min-height:42px}
  .dock-body > div:first-child .lbl{min-height:20px}
  .cs-grid{grid-template-columns:minmax(0,1fr)}
  .doll.big{--s:78px}
  .card{--k:.86}
  .hand{min-height:168px}
  .card.big{--k:1.75}
  .status{font-size:13px;min-width:0;flex-basis:100%}
  .combat{padding:8px 12px 10px}
  .cside .big{font-size:36px}
}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div id="scene"></div>
<div id="ui">
  <div class="topbar" id="topbar">
    <div class="brand">Пройдисвіти<small>настільна гра в підземеллі</small></div>
    <div class="top-actions">
      <button class="btn small" id="btnSound" type="button">Звук</button>
      <button class="btn small" id="btnSkin" type="button">Стіл</button>
      <button class="btn small" id="btnRules" type="button">Правила</button>
      <button class="btn small" id="btnLog" type="button">Журнал</button>
      <button class="btn small" id="btnNew" type="button">Нова гра</button>
    </div>
  </div>
  <div class="middle">
    <aside class="board" id="players" aria-label="Табло рівнів"></aside>
    <div class="side">
      <section class="combat" id="combat" hidden></section>
      <aside class="log" id="log"><header><span>Журнал</span><button class="btn small ghost" id="btnLogClose" type="button">Сховати</button></header><ol id="logList"></ol></aside>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="banner" id="banner" aria-hidden="true"></div>
  </div>
  <div class="dock" id="dock">
    <div class="dock-head">
      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="dock-body">
      <div>
        <div class="lbl">Персонаж <span id="strText"></span><button class="linkbtn" type="button" data-sheet>Картка персонажа</button></div>
        <div class="equip" id="equip"></div>
      </div>
      <div>
        <div class="lbl">Рука <span id="handOwner"></span></div>
        <div class="hand" id="hand"></div>
      </div>
    </div>
  </div>
</div>
<div class="menu" id="menu" hidden></div>
<div class="peek" id="peek" hidden aria-hidden="true"></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ============================== УТИЛІТИ ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let botSpeed = 1, ANIM = 1.5;
const botDelay = ms => wait(ms * botSpeed);
const AF = reduceMotion ? 0.35 : 1; // множник тривалості анімацій
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; }
const EMOJI_FONT = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';

/* ============================== КАРТИ ============================== */
const RACES = {
  elf: { name: 'Ельф', art: '🧝', text: '+1 до втечі. Коли допомагає перемогти монстра, отримує рівень.', flavor: 'Вічно молодий. Вічно запізнюється.' },
  dwarf: { name: 'Гном', art: '⛏️', text: 'Тримає до 6 карт у руці. Може носити кілька великих речей.', flavor: 'Невисокий, зате кишені глибокі.' },
  halfling: { name: 'Напіврослик', art: '🍄', text: 'Якщо втеча не вдалася, один раз перекидає кубик.', flavor: 'Другий сніданок — святе.' }
};
const CLASSES = {
  warrior: { name: 'Воїн', art: '⚔️', text: '+1 у бою. Перемагає монстра навіть за нічиєї.', flavor: 'Спершу бʼє, потім читає картку монстра.' },
  wizard: { name: 'Маг', art: '🔮', text: 'У бою може скинути до 3 карт із руки: +2 за кожну.', flavor: 'Знає триста заклинань. Згадує одне.' },
  cleric: { name: 'Жрець', art: '📿', text: '+3 у бою проти нежиті.', flavor: 'Молиться за перемогу. І за знижку.' }
};
const VS_NAMES = { m: 'чоловіків', f: 'жінок', elf: 'ельфів', dwarf: 'гномів', halfling: 'напівросликів', warrior: 'воїнів', wizard: 'магів', cleric: 'жерців' };
const SLOT = { head: 'Голова', body: 'Тіло', feet: 'Ноги', hands: 'Руки', misc: 'Дрібниця' };
const BAD = {
  lvl: n => ({ t: 'level', n, text: `Втрачаєш ${n} ${plural(n, 'рівень', 'рівні', 'рівнів')}.` }),
  slot: s => ({ t: 'slot', slot: s, text: { head: 'Втрачаєш головний убір.', body: 'Втрачаєш броню.', feet: 'Втрачаєш взуття.', hands: 'Втрачаєш усе, що тримаєш у руках.', misc: 'Втрачаєш дрібну річ.' }[s] }),
  hand: n => ({ t: 'hand', n, text: n >= 99 ? 'Скидаєш усі карти з руки.' : n === 1 ? 'Скидаєш 1 випадкову карту з руки.' : `Скидаєш ${n} випадкові карти з руки.` }),
  best: { t: 'best', text: 'Втрачаєш найдорожчу річ.' },
  gold: { t: 'gold', text: 'Втрачаєш усе золото.' },
  race: { t: 'race', text: 'Втрачаєш расу.' },
  cls: { t: 'class', text: 'Втрачаєш клас.' },
  gear: { t: 'gear', text: 'Втрачаєш усе спорядження.' },
  sex: { t: 'sex', text: 'Твоя стать змінюється. Речі «лише для» іншої статі перестають діяти.' },
  death: { t: 'death', text: 'Смерть: втрачаєш усі речі й карти. Рівень, раса й клас лишаються.' }
};

let UID = 0;
const mk = o => (o.uid = ++UID, o);

function buildDoorDeck(epic = false) {
  const d = [];
  const M = (name, lvl, treasures, art, bad, o = {}) => d.push(mk({ deck: 'door', kind: 'monster', name, lvl, treasures, art, bad: o.bt ? { ...bad, text: o.bt } : bad, levels: o.levels || 1, undead: !!o.undead, vs: o.vs || null, flavor: o.flavor || '' }));
  const DEATH = 'Смерть: усі речі й карти — у скид.';
  M('Хробак-книгоїд', 1, 1, '🐛', BAD.hand(2), { flavor: 'Прочитав усе. Навіть правила.', bt: 'Гризе твої карти, як конспект перед іспитом. Скинь 2 випадкові карти.' });
  M('Злий Вареник', 1, 1, '🥟', BAD.slot('feet'), { flavor: 'Ліплений з образою.', bt: 'Стрибає тобі на ноги зі сметаною. Взуття не відмити — втрачаєш його.' });
  M('Миша-диверсантка', 1, 1, '🐭', BAD.slot('misc'), { flavor: 'Перегризла кабель. І твій мішок.', bt: 'Тягне з кишені все дрібне. Втрачаєш дрібну річ.' });
  M('Равлик-рекетир', 2, 1, '🐌', BAD.gold, { flavor: 'Повільно, але невідворотно.', bt: '«Платиш за охорону?» Тепер платиш. Втрачаєш усе золото.' });
  M('Їжак-колючкар', 2, 1, '🦔', BAD.slot('body'), { flavor: 'Обійми його. Ну ж бо.', bt: 'Обіймає на прощання. Броня — решето, викинь її.' });
  M('Курка-ніндзя', 2, 1, '🐔', BAD.lvl(1), { flavor: 'Ти навіть не бачив, звідки прилетіло яйце.', bt: 'Яйце влучає в лоб, і ти забуваєш, що вмів. −1 рівень.' });
  M('Кіт-податківець', 3, 1, '🐈', BAD.best, { flavor: 'Мяу. Квитанцію збережіть.', bt: 'Оцінює твоє майно і забирає найдорожчу річ. Усе за законом.' });
  M('Гоблін-колектор', 3, 1, '👺', BAD.lvl(1), { flavor: 'Ваш борг передано… мені.', bt: 'Пеня, штраф, комісія за штраф. −1 рівень.' });
  M('Комар-упир', 4, 2, '🦟', BAD.lvl(1), { undead: true, flavor: 'Дзизчить над вухом із 1650 року.', bt: 'Пʼє кров, поки ти чухаєшся. −1 рівень.' });
  M('Гарбузовий жах', 4, 2, '🎃', BAD.slot('head'), { undead: true, flavor: 'Порожній усередині. Як і ти після бою.', bt: 'Надягає тобі гарбуз на голову. Шолом тепер у ньому — втрачаєш головний убір.' });
  M('Восьминіг-бариста', 5, 2, '🐙', BAD.hand(99), { flavor: 'Вісім лап, вісім капучино, жодної решти.', bt: 'Вісім рук — вісім твоїх карт. Скинь усю руку.' });
  M('Кажан-караоке', 5, 2, '🦇', BAD.lvl(1), { vs: { elf: 3 }, flavor: 'Співає тільки о третій ночі.', bt: 'Співає тобі на вухо до ранку. −1 рівень від недосипу.' });
  M('Скелет-бухгалтер', 6, 2, '💀', BAD.hand(99), { undead: true, flavor: 'Звіряє кістки з дебетом.', bt: 'Проводить аудит твоєї руки. Списано все — скинь усі карти.' });
  M('Павук-пенсіонер', 6, 2, '🕷️', BAD.slot('hands'), { flavor: 'Плете сітки й інтриги.', bt: 'Плутає руки павутиною і читає мораль. Втрачаєш усе, що тримаєш у руках.' });
  M('Бобер-будівельник', 7, 2, '🦡', BAD.slot('body'), { vs: { dwarf: 4 }, flavor: 'Гатить греблю з твоїх речей.', bt: 'Розбирає твою броню на дамбу. Втрачаєш броню.' });
  M('Трол із коментарів', 7, 2, '👾', BAD.lvl(2), { flavor: 'Пише капслоком. Бʼє так само.', bt: 'Коментує кожен твій крок, і ти сумніваєшся в собі. −2 рівні.' });
  M('Зомбі-маршрутник', 8, 2, '🧟', BAD.lvl(2), { undead: true, flavor: '«На зупинці!» — і ніхто не зупинився.', bt: 'Везе тебе не туди. Дуже не туди. −2 рівні.' });
  M('Мавка ображена', 8, 2, '🌿', BAD.cls, { vs: { m: 3 }, flavor: 'Ти не так подивився на її калину.', bt: 'Каже, що ти вже не той. І вона права — втрачаєш клас.' });
  M('Відьма з борщем', 9, 3, '🧙', BAD.race, { flavor: 'Рецепт секретний. Ти — інгредієнт.', bt: 'Варить зілля з твого родоводу. Втрачаєш расу.' });
  M('Огр-кулінар', 10, 3, '👹', BAD.lvl(2), { flavor: 'Шукає начинку до пиріжків.', bt: 'Маринує тебе на вечерю. Ледве вирвався: −2 рівні.' });
  M('Привид тещі', 10, 3, '👻', BAD.best, { undead: true, vs: { warrior: 3 }, flavor: 'Знає, що ти зробив минулого літа.', bt: 'Нагадує, скільки ти їй винен, і забирає найдорожчу річ.' });
  M('Вовкулака', 12, 3, '🐺', BAD.lvl(2), { flavor: 'Повний місяць, повний рот зубів.', bt: 'Кусає, і ти тиждень виєш на місяць. −2 рівні.' });
  M('Кракен із калюжі', 12, 3, '🦑', BAD.gear, { flavor: 'Калюжа виявилася глибшою.', bt: 'Тягне в калюжу все, що на тобі. Втрачаєш усе спорядження.' });
  M('Чорт-юрист', 14, 4, '😈', BAD.lvl(3), { levels: 2, flavor: 'Прочитай дрібний шрифт. Запізно.', bt: 'Ти підписав. Дрібним шрифтом. −3 рівні.' });
  M('Мімік-холодильник', 14, 4, '❄️', BAD.gear, { levels: 2, flavor: 'Всередині лише гірчиця і зуби.', bt: 'Ти відчинив дверцята. Речей у тебе більше немає.' });
  M('Змій-стажер', 16, 4, '🐉', BAD.death, { levels: 2, flavor: 'Три голови, нуль досвіду, повно вогню.', bt: 'Три голови вчаться дихати вогнем. На тобі. ' + DEATH });
  M('Лич-бюрократ', 18, 4, '☠️', BAD.death, { levels: 2, undead: true, flavor: 'Приходьте завтра. Назавжди.', bt: 'Видає довідку про твою смерть. Печатка є. ' + DEATH });
  M('Дракон-скнара', 20, 5, '🐲', BAD.death, { levels: 2, flavor: 'Спить на золоті. Прокидається на тобі.', bt: 'Ти торкнувся його золота. ' + DEATH });
  M('Хомʼяк-скнара', 1, 1, '🐹', BAD.hand(1), { flavor: 'Щоки — його банк.', bt: 'Набиває щоки твоїми картами. Скинь 1 випадкову карту.' });
  M('Сонечко-шантажистка', 2, 1, '🐞', BAD.gold, { flavor: 'Мила лише на вигляд.', bt: 'Знає твої секрети. Мовчання коштує все твоє золото.' });
  M('Качка-контролерка', 3, 1, '🦆', BAD.slot('feet'), { flavor: 'Кря. Ваш квиточок?', bt: 'Квитка в тебе нема. Штраф — твоє взуття.' });
  M('Бджолиний рій', 4, 2, '🐝', BAD.lvl(1), { flavor: 'Мед — не для тебе.', bt: 'Ти тікаєш, рій наздоганяє. −1 рівень.' });

function deckTopY(kind) { const n = (kind === 'door' ? G.doorDeck : G.treasureDeck).length; return TABLE_Y + n * 0.014 + 0.02; }

const discardPose = kind => ({ x: DISC_POS[kind][0], y: TABLE_Y + 0.05, z: DISC_POS[kind][1], yaw: 0, tilt: 0, flip: 0, s: 1 });
const monScale = n => n >= 3 ? 1.12 : n === 2 ? 1.3 : 1.5;
function centerPose(i = 0, n = 1) { const s = monScale(n), sp = CARD_W * s + .18; return { ...rotY((i - (n - 1) / 2) * sp, 1.6 - (1.5 - s) * .9, -0.25, cam.az), yaw: cam.az, tilt: 1.2, flip: 0, s, tag: { k: 'c', i, n } }; }

function handPose() {
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const p = camera.position.clone().addScaledVector(dir, 5.5).addScaledVector(up, -2.0);
  return { x: p.x, y: p.y, z: p.z, yaw: cam.az + cam.userAz, tilt: Math.PI / 2 - clamp(cam.el + cam.userEl, .25, 1.35), flip: 0, s: 0.85, tag: { k: 'h', who: G.viewer } };
}
const isViewerHuman = p => p.type === 'human' && p.idx === G.viewer;
const fromHandOf = p => isViewerHuman(p) ? handPose() : seatPose(p.idx, false);

function syncDeck(kind) {
  const m = T.decks[kind]; if (!m) return;
  const n = (kind === 'door' ? G.doorDeck : G.treasureDeck).length;
  const h = Math.max(.001, n * .014); m.scale.y = h; m.position.y = TABLE_Y + h / 2; m.visible = n > 0;
}
function syncDiscardTop(kind) {
  const m = T.disc[kind]; if (!m) return;
  const pile = kind === 'door' ? G.doorDiscard : G.treasureDiscard;
  if (!pile.length) { m.visible = false; return; }
  const top = pile[pile.length - 1];
  m.material[2].map = faceTex(top); m.material[2].needsUpdate = true; m.userData.card = top;
  m.position.y = TABLE_Y + .015 + Math.min(pile.length, 30) * .004; m.rotation.y = (top.uid % 7 - 3) * .03; m.visible = true;
}

/* --- місця гравців --- */
function plateDraw(p) {
  const t = p.seat.plateTex, g = t.userData.g, c = t.userData.canvas, w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  rr(g, 6, 14, w - 12, h - 28, 46); g.fillStyle = 'rgba(16,11,9,.86)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = p.idx === G.cur ? '#e0a93b' : 'rgba(224,169,59,.35)'; g.stroke();
  g.fillStyle = p.color; g.beginPath(); g.arc(62, h / 2, 40, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#15100d'; g.font = '50px Underdog, cursive'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(p.level), 62, h / 2 + 3);
  g.fillStyle = '#f3e9d8'; g.textAlign = 'left'; g.font = '700 40px Rubik, sans-serif';
  let name = p.name; while (g.measureText(name).width > w - 140 && name.length > 3) name = name.slice(0, -2) + '…';
  g.fillText(name, 118, h / 2 + 2);

}
function buildSeat(p) {

  const equipG = new THREE.Group(); grp.add(equipG);
  const plateTex = canvasTex(512, 128, () => {});
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: plateTex, transparent: true, depthWrite: false }));
  sprite.userData.player = p.idx; sprite.scale.set(3.2, .8, 1); sprite.position.set(0, 1.05, 8.35); grp.add(sprite);
  const arcMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(p.color), transparent: true, opacity: .45, side: THREE.DoubleSide, depthWrite: false });
  const arc = new THREE.Mesh(new THREE.RingGeometry(7.95, 8.18, 40, 1, -Math.PI / 2 - .38, .76), arcMat);
  arc.rotation.x = -Math.PI / 2; arc.position.y = TABLE_Y + .006; grp.add(arc);
  p.seat = { grp, equipG, plateTex, sprite, arc, arcMat, anchor: seatAnchor(p.idx) };
  plateDraw(p); syncSeat(p);
}
function destroySeat(p) {
  if (!p.seat) return;
  [...p.seat.equipG.children].forEach(disposeMesh);
  scene.remove(p.seat.grp);
  p.seat.plateTex.dispose(); p.seat.arcMat.dispose();
}
function syncSeat(p) {
  if (!p.seat) return;
  const grp = p.seat.equipG; [...grp.children].forEach(disposeMesh);
  const items = [p.raceCard, p.clsCard, ...p.gear].filter(Boolean); const n = items.length;
  const gap = Math.min(.8, 5.4 / Math.max(1, n));
  items.forEach((c, i) => {
    const m = cardMesh(c); m.scale.setScalar(.62);
    m.position.set((i - (n - 1) / 2) * gap, TABLE_Y + .03 + i * .003, 6.4); m.rotation.set(-.06, 0, 0); grp.add(m);
  });
  plateDraw(p);
}
function levelFx(p, up) {
  const a = p.seat.anchor; sfx(up ? 'levelUp' : 'levelDown');
  ringFx(a, up ? 0xffd36b : 0xff4a3a);
  if (up) burst(a.clone().setY(.8), [p.color, '#ffd36b', '#ffffff'], 70, 3.5, 1.1);
  else flashAt(a.clone().setY(2), 2.5, 600);
}
async function changeLevel(p, delta, allowWin = false) {
  const before = p.level;
  const cap = allowWin ? G.goal : Math.max(before, G.goal - 1);
  p.level = clamp(before + delta, 1, cap);
  if (p.level !== before) {
    log(`${nameTag(p)} ${p.level > before ? 'піднімається' : 'падає'} на ${p.level}-й рівень.`);
    levelFx(p, p.level > before); renderUI(); await wait(550);
  } else if (delta > 0 && !allowWin && before >= G.goal - 1) log(`${nameTag(p)} не може отримати ${G.goal}-й рівень так — лише перемогою над монстром.`);
  plateDraw(p);
  if (p.level >= G.goal) await gameOver(p);
  else if (G.goal > 10 && before < EPIC_AT && p.level >= EPIC_AT) { say(`${p.name} в епічній зоні: монстри для нього тепер ×2!`, 2800); log(`${nameTag(p)} входить в епічну зону: рівні монстрів для нього подвоюються.`); }
}

/* --- ефекти --- */
function emitFx(type, a) { if (NET.role === 'host') netAll({ t: 'fx', type, a }); }
function flashAt(pos, i = 2.5, dur = 600, color = 0xff3020, quiet = false) {
  if (!quiet) emitFx('flash', { x: pos.x, y: pos.y, z: pos.z, i, dur, color });
  T.flash.color.setHex(color); T.flash.position.copy(pos); animate(dur, t => { T.flash.intensity = i * Math.sin(Math.PI * Math.min(1, t * 1.6 + .37)); });
}
function ringFx(pos, color, dur = 900, quiet = false) {
  if (!quiet) emitFx('ring', { x: pos.x, z: pos.z, color, dur });
  const m = new THREE.Mesh(new THREE.RingGeometry(.3, .44, 48), new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.rotation.x = -Math.PI / 2; m.position.set(pos.x, TABLE_Y + .16, pos.z); scene.add(m);
  animate(dur, t => { m.scale.setScalar(1 + t * 3.5); m.material.opacity = 1 - t; }, easeOut).then(() => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
}
function burst(pos, colors, n = 150, speed = 5.5, life = 1.4, gravity = -7, size = .16, additive = true, spread = 1, quiet = false) {
  if (!quiet) emitFx('burst', { x: pos.x, y: pos.y, z: pos.z, colors, n, speed, life, gravity, size, additive, spread });
  const geo = new THREE.BufferGeometry(); const P = new Float32Array(n * 3), C = new Float32Array(n * 3), V = [];
  const col = new THREE.Color();
  for (let i = 0; i < n; i++) {
    P[i * 3] = pos.x + (Math.random() - .5) * spread; P[i * 3 + 1] = pos.y + (Math.random() - .5) * spread * .5; P[i * 3 + 2] = pos.z + (Math.random() - .5) * spread;
    V.push(new THREE.Vector3(Math.random() - .5, Math.random() * .9 + .2, Math.random() - .5).normalize().multiplyScalar(speed * (.35 + Math.random() * .8)));
    col.set(colors[rnd(colors.length)]); C[i * 3] = col.r; C[i * 3 + 1] = col.g; C[i * 3 + 2] = col.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(P, 3)); geo.setAttribute('color', new THREE.BufferAttribute(C, 3));
  const mat = new THREE.PointsMaterial({ size, map: T.dot, vertexColors: true, transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
  const pts = new THREE.Points(geo, mat); scene.add(pts);
  T.fx.push({ pts, V, t: 0, life, gravity });
}
function hitFx(p) { sfx('hit'); ringFx(p.seat.anchor, 0xff4a3a); flashAt(p.seat.anchor.clone().setY(2), 3, 600); }
async function roar(m) {
  playSfx('roar');
  if (m.userData.card) emitFx('roar', { uid: m.userData.card.uid });
  const p0 = poseOf(m); m.userData.anim = true;
  T.flash.color.setHex(0xff3020); T.flash.position.set(m.position.x, 2.5, m.position.z);
  await animate(650, t => {
    const k = Math.sin(t * Math.PI);
    applyPose(m, { ...p0, s: p0.s * (1 + k * .12), flip: Math.sin(t * Math.PI * 9) * .06 * (1 - t), y: p0.y + k * .25 });
    T.flash.intensity = k * 2.2;
  });
  applyPose(m, p0); T.flash.intensity = 0; m.userData.anim = false;
}

  if (!m) return; if (m.userData.card) emitFx('lunge', { uid: m.userData.card.uid });
  const p0 = poseOf(m); const w = rotY(0, 0, 1.4, cam.az); m.userData.anim = true;
  await animate(380, t => { const k = Math.sin(t * Math.PI); applyPose(m, { ...p0, x: p0.x + w.x * k, z: p0.z + w.z * k, y: p0.y + k * .3 }); });
  applyPose(m, p0); m.userData.anim = false;
}

  const p0 = poseOf(m); m.userData.anim = true;

  await animate(420, t => applyPose(m, { ...p0, s: p0.s * (1.1 - t * 1.1) + .001, yaw: p0.yaw + t * 4, y: p0.y + t * .6 }), easeOut);

async function rollDie(q, forced = 0) {
  const v = forced || 1 + rnd(6);
  playSfx('dice');
  emitFx('die', { who: q.idx, v, ok: v + fleeBonus(q) >= 5 });
  const FACE = { 1: [0, 0, 0], 6: [Math.PI, 0, 0], 3: [0, 0, Math.PI / 2], 4: [0, 0, -Math.PI / 2], 2: [-Math.PI / 2, 0, 0], 5: [Math.PI / 2, 0, 0] }[v];
  const qFinal = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(FACE[0], FACE[1], FACE[2])));
  const axis = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
  const spins = Math.PI * 2 * (3 + Math.random() * 2);
  const from = rotY(0, 3, 6.4, seatAngle(q.idx)); const to = rotY((Math.random() - .5) * 1.2, TABLE_Y + .28, 2.3, cam.az);
  T.die.visible = true;
  await animate(1150, (e, t) => {
    T.die.position.set(from.x + (to.x - from.x) * e, to.y + (from.y - to.y) * Math.pow(1 - e, 2) + Math.pow(1 - t, 1.5) * Math.abs(Math.sin(t * Math.PI * 3)) * 1.4, from.z + (to.z - from.z) * e);
    T.die.quaternion.copy(qFinal).multiply(new THREE.Quaternion().setFromAxisAngle(axis, spins * (1 - e)));
  }, easeOut);
  T.die.position.set(to.x, to.y, to.z); T.die.quaternion.copy(qFinal);
  ringFx(T.die.position, v + fleeBonus(q) >= 5 ? 0x7fd081 : 0xff4a3a, 700, true);
  await wait(450);
  return v;
}
function confetti(color) {
  emitFx('confetti', { color });
  for (let i = 0; i < 4; i++) setTimeout(() => burst(new THREE.Vector3((Math.random() - .5) * 8, 9, (Math.random() - .5) * 8), [color, '#ffd36b', '#ffffff', '#ef6b5d', '#5aa9e2', '#86cf6e'], 260, 5, 4.5, -2.6, .22, false, 6, true), i * 450);
}
function camTo(az) {
  const a0 = cam.az; let d = ((az - a0) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  if (Math.abs(d) < .001) return Promise.resolve();
  const u0 = cam.userAz, e0 = cam.userEl;
  return animate(1100, t => { cam.az = a0 + d * t; cam.userAz = u0 * (1 - t); cam.userEl = e0 * (1 - t); });
}

/* --- цикл --- */
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);

function meddleOptions(b) {
  const cb = G.combat, p = fighter(), opts = [];
  const undeadIn = cb.mons.some(x => x.c.undead);
  b.hand.forEach(c => {
    if ((c.kind === 'mod' && c.bonus > 0) || c.kind === 'oneshot') opts.push({ pw: c.bonus, run: () => playIntoCombat(b, c, 'mon') });
    if (c.kind === 'monster' && c.undead && undeadIn) opts.push({ pw: monLvl(c, p) + vsBonus(c, p), mon: true, run: () => addMonster(b, c, null) });
  });
  const w = b.hand.find(c => c.kind === 'wander');
  if (w) b.hand.filter(c => c.kind === 'monster').forEach(mc => opts.push({ pw: monLvl(mc, p) + vsBonus(mc, p), mon: true, run: () => addMonster(b, mc, w) }));
  return opts;
}
async function botsInterfere() {
  const p = fighter(); if (!G.combat) return false; let any = false;
  const leader = Math.max(...G.players.filter(q => q !== p).map(q => q.level));
  for (const b of G.players) {
    if (!G.combat || G.over) return any;
    const cb = G.combat;
    if (b === p || b.idx === cb.helper || b.type !== 'bot' || cb.interfered.has(b.idx)) continue;
    const s = sides(); if (!s.win) continue;
    const D = DIFF[b.diff || 2]; const mem = (b.mem && b.mem[p.idx]) || 0;
    const winning = p.level + levelsGain() >= G.goal;
    const chance = winning ? D.block : D.meddle + (p.level >= leader ? D.lead : 0) + (p.level >= G.goal * .6 ? .1 : 0) - mem * D.grudge;
    if (Math.random() > clamp(chance, 0, 1)) continue;
    const need = s.hero - s.mon + (s.tie ? 1 : 0);
    const opts = meddleOptions(b); if (!opts.length) continue;
    let pick;
    if (b.diff === 1) pick = opts[rnd(opts.length)];
    else pick = opts.filter(o => o.pw >= need).sort((x, y) => x.pw - y.pw || (x.mon ? 1 : -1))[0] || opts.filter(o => !o.mon).sort((x, y) => y.pw - x.pw)[0];
    if (!pick) continue;
    cb.interfered.add(b.idx); any = true;
    await botDelay(350);
    await pick.run();
    if (winning) say(`${b.name} не дає ${p.name} виграти!`);
    else if (mem <= -3 && (b.diff || 2) >= 2) say(`${b.name} мстить ${p.name}!`, 1800);
  }
  return any;
}

  if (t.type === 'remote') { const pick = await askRemoteTrade(t, p.name, info); return pick && pick.map(u => findTradeItem(t, u)).filter(Boolean); }
  const pv = G.viewer, pr = G.reveal, priv = privacy();
  if (priv) { G.reveal = -1; closeMenu(); renderUI(); await curtain(t); }
  const pick = await tradePickModal(t, p.name, info);
  if (priv) {
    G.reveal = -1; renderUI();
    const back = G.players[pv];
    if (back && back.type === 'human') { await curtain(back); G.viewer = pv; G.reveal = pv; } else { G.viewer = pv; G.reveal = pr; }
    renderUI();
  }
  return pick && pick.map(u => findTradeItem(t, u)).filter(Boolean);
}
async function doTrade(p, t, give) {
  if (!t || t === p) return;
  const names = l => l.length ? l.map(c => '«' + c.name + '»').join(', ') : 'нічого';
  log(`${nameTag(p)} пропонує обмін гравцеві ${nameTag(t)}${give.length ? `: віддає ${esc(names(give))}` : ''}.`);
  renderUI();
  let take = null, why = '';
  if (t.type === 'bot') { await botDelay(650); const d = botTradeOffer(t, p, give); take = d.ok ? d.take : null; why = d.why; }
  else take = await humanTradeOffer(t, p, give);
  if (!take) { log(`${nameTag(t)} відмовляється від обміну.${why ? ` <i>«${esc(why)}»</i>` : ''}`); tell(p, `${t.name}: ${why ? '«' + why + '»' : 'відмова'}`, 2600); memo(p, t, -.5); return; }
  if (!give.length && !take.length) return;
  if (give.some(c => !findTradeItem(p, c.uid)) || take.some(c => !findTradeItem(t, c.uid))) { tell(p, 'Речі вже змінилися — обмін скасовано.'); return; }
  const ok = await confirmFor(p, `${t.name} відповідає`, `${why ? '«' + why + '» ' : ''}За ${names(give)} ${t.name} ${take.length ? 'пропонує натомість: ' + names(take) : 'нічого не дає натомість'}. Згоден?`, take.length ? 'Міняємось' : 'Подарувати', 'Відмовитись');
  if (!ok) { log(`${nameTag(p)} не погоджується на пропозицію ${nameTag(t)}.`); memo(t, p, -.3); return; }
  if (give.some(c => !findTradeItem(p, c.uid)) || take.some(c => !findTradeItem(t, c.uid))) { tell(p, 'Речі вже змінилися — обмін скасовано.'); return; }
  const move = async (from, to, c) => {
    if (from.gear.includes(c)) from.gear.splice(from.gear.indexOf(c), 1); else removeFromHand(from, c);
    const m = cardMesh(c); scene.add(m);
    const a = seatAngle(from.idx), w = rotY(0, TABLE_Y + .05, 6.4, a);
    await fly(m, { ...w, yaw: a, tilt: 0, flip: 0, s: .62 }, toHandOf(to), 650, 1.8, { owner: to.idx });
    disposeMesh(m); giveCard(to, c);
  };
  for (const c of give) await move(p, t, c);
  for (const c of take) await move(t, p, c);
  syncSeat(p); syncSeat(t);
  memo(p, t, 1); memo(t, p, 1);
  sfx('coins'); log(`Обмін відбувся: ${nameTag(p)} ⇄ ${nameTag(t)}.`); say(`${p.name} і ${t.name} помінялися речами`, 2000);
  if (t.type === 'bot') { for (let g = 0; g < 6; g++) { const before = gearScore(t, t.gear); const best = t.hand.filter(c => c.kind === 'gear' && !canEquip(t, c)).map(c => ({ c, s: gearScore(t, gearAfter(t, c)) })).sort((a, b) => b.s - a.s)[0]; if (!best || best.s <= before + .01) break; await doEquip(t, best.c); } }
  renderUI();
}
function openCharityPick(v, act) {

}
function openTrade() {

      <h3>Ти віддаєш (${gv} зол.)</h3><div class="ochips">${mine.map(c => chip(c, st.give, 'gv')).join('') || '<p class="hint">У тебе немає речей.</p>'}</div>

}

async function doEquip(p, c) {
  const err = canEquip(p, c); if (err) { tell(p, err); return; }
  const m = cardMesh(c); scene.add(m);
  const a = seatAngle(p.idx); const w = rotY(0, TABLE_Y + .05, 6.4, a);
  await fly(m, fromHandOf(p), { ...w, yaw: a, tilt: 0, flip: 0, s: .62 }, 520, 1.2, { owner: p.idx });
  disposeMesh(m);

  log(`${nameTag(p)} споряджається: «${esc(c.name)}»${rem.length ? ` (знімає ${esc(rem.map(r => r.name).join(', '))})` : ''}.`);

}
async function unequip(p, c) { p.gear.splice(p.gear.indexOf(c), 1); giveCard(p, c); syncSeat(p); renderUI(); }
async function doSell(p, c) {
  if (p.gear.includes(c)) p.gear.splice(p.gear.indexOf(c), 1); else removeFromHand(p, c);
  discard(c); p.gold += c.value; sfx('coins');
  log(`${nameTag(p)} продає «${esc(c.name)}» за ${c.value} зол.`);
  let gained = 0; while (p.gold >= 1000 && p.level + gained < G.goal - 1) { p.gold -= 1000; gained++; }
  syncSeat(p); renderUI();
  burst(p.seat.anchor.clone().setY(1), ['#ffd36b', '#f5c04a'], 40, 2.5, .9);
  if (gained) { say(`${p.name}: +${gained} ${plural(gained, 'рівень', 'рівні', 'рівнів')} за золото`); await changeLevel(p, gained); }
}
async function doPlayRC(p, c) {

    const m2 = cardMesh(old); scene.add(m2);

async function doLevelUp(p, c) {

/* --- боти --- */
async function botManage(p) {
  for (const kind of ['race', 'class']) {
    const key = kind === 'race' ? 'raceCard' : 'clsCard';
    const c = p.hand.find(x => x.kind === kind);
    if (c && !p[key]) { await botDelay(300); await doPlayRC(p, c); }
  }
  for (let guard = 0; guard < 8; guard++) {
    const before = gearScore(p, p.gear);
    const best = p.hand.filter(c => c.kind === 'gear' && !canEquip(p, c)).map(c => ({ c, s: gearScore(p, gearAfter(p, c)) })).sort((a, b) => b.s - a.s)[0];
    if (!best || best.s <= before + .01) break;
    await botDelay(250); await doEquip(p, best.c);
  }
  for (const c of p.hand.filter(x => x.kind === 'levelup')) if (p.level < G.goal - 1) { await botDelay(250); await doLevelUp(p, c); }
  if (cur() === p && G.phase !== 'combat' && p.level < G.goal - 1) {
    const spare = p.hand.filter(c => c.kind === 'gear' && (canEquip(p, c) || gearScore(p, gearAfter(p, c)) <= gearScore(p, p.gear)));
    if (p.gold + sum(spare, c => c.value) >= 1000) for (const c of spare) { if (p.level >= G.goal - 1) break; await botDelay(200); await doSell(p, c); }
  }
  const curse = p.hand.find(c => c.kind === 'curse');
  const D = DIFF[p.diff || 2];
  if (curse && Math.random() < D.curse) {
    const grudge = q => -((p.mem && p.mem[q.idx]) || 0);
    const targets = G.players.filter(q => q !== p && badHits(q, curse.bad));
    let t = null;
    if (p.diff === 1) t = targets[rnd(targets.length)] || null;
    else {
      const top = Math.max(...G.players.map(q => q.level));
      const score = q => q.level + (q.level === top ? 3 : 0) + grudge(q) * 1.5 + baseStr(q) * .1;
      t = targets.sort((a, b) => score(b) - score(a))[0] || null;
      if (t && p.diff === 2 && !(t.level >= p.level || grudge(t) >= 3)) t = null;
    }
    if (t) { await botDelay(350); await doCurse(p, curse, t); }
  }
}
async function botTurn(p) {
  if (G.phase === 'start') {
    await botDelay(450);
    await botManage(p); if (G.over) return;
    await botDelay(300);
    await kickDoor(); if (G.over) return;
  }
  if (G.phase === 'combat' && G.combat) { if (fighter().type === 'bot') await botDrive(); if (G.combat && !G.over) await waitCombatEnd(); if (G.over) return; }
  if (G.phase === 'afterKick') {
    await botManage(p); if (G.over) return;
    const str = baseStr(p);
    const m = p.hand.filter(c => c.kind === 'monster' && monLvl(c, p) + vsBonus(c, p) + 2 < str).sort((a, b) => b.treasures - a.treasures || b.lvl - a.lvl)[0];
    await botDelay(400);
    if (m) { await lookForTrouble(m); if (G.combat && !G.over) await waitCombatEnd(); } else await loot();
  }
  if (G.over) return;
  await botManage(p); if (G.over) return;
  await botDelay(400);
  await endTurn();
}

async function gameOver(p) {

  G.over = true; G.phase = 'over'; G.busy = false; G.window = null;
  log(`${nameTag(p)} досягає ${G.goal}-го рівня і перемагає!`, 'turn');

}

    ${isHost ? '' : '<p class="hint" style="text-align:center">Нову партію запускає господар кімнати.</p>'}`);

/* ============================== ДІЇ: ОДНА СИСТЕМА ДЛЯ ЛЮДЕЙ НА ЦЬОМУ Й ІНШИХ ПРИСТРОЯХ ============================== */
const sameAct = (a, b) => !!a && !!b && a.k === b.k && (a.uid || 0) === (b.uid || 0) && (a.side || '') === (b.side || '') && (a.target == null ? -1 : a.target) === (b.target == null ? -1 : b.target) && (a.mon || 0) === (b.mon || 0);
function findOwnCard(p, uid) {
  const h = p.hand.find(c => c.uid === uid); if (h) return { c: h, where: 'hand' };
  const g = [p.raceCard, p.clsCard, ...p.gear].find(c => c && c.uid === uid); return g ? { c: g, where: 'gear' } : null;
}
const flatActs = list => list.flatMap(a => a.sub ? a.sub : [a]);
function actAllowed(p, act) {
  if (!act || G.over) return false;
  if (act.k === 'pass') return waitingOn().includes(p);
  if (act.k === 'trade') return canTrade(p) && !!G.players[act.target] && act.target !== p.idx;
  if (act.k === 'help') { const cb = G.combat; return !G.busy && G.phase === 'combat' && !!cb && p === fighter() && cb.helper == null && !!G.players[act.target] && act.target !== p.idx && !cb.asked.has(act.target); }
  if (act.uid) { const f = findOwnCard(p, act.uid); return !!f && flatActs(cardActions(f.c, f.where, p)).some(a => !a.dis && sameAct(a.act, act)); }
  return dockActs(p).some(a => a.act && !a.dis && sameAct(a.act, act));
}
function dispatch(act, asIdx = G.viewer) {
  closeMenu();
  if (NET.role === 'client') { netSendHost({ t: 'act', act }); return; }
  runAct(asIdx, act);
}
async function runAct(pi, act) {
  const p = G.players[pi]; if (!p || G.over) return;
  if (!actAllowed(p, act)) { tell(p, 'Зараз так не можна.', 1600); if (p.type === 'human') playSfx('deny'); else netSendTo(p.idx, { t: 'fx', type: 'sfx', a: { n: 'deny' } }); renderUI(); return; }
  if (act.k === 'pass') { passWindow(p); return; }
  if (G.window && G.window.humans.includes(p)) { const w = G.window; G.window = null; closeModal(); renderUI(); await execAct(p, act); w.resolve('played'); return; }
  if (G.busy) return;
  G.busy = true; renderUI();
  try { await execAct(p, act); } finally { if (G.phase !== 'next') G.busy = false; renderUI(); }
}
async function execAct(p, a) {
  const f = a.uid ? findOwnCard(p, a.uid) : null; const c = f && f.c;
  switch (a.k) {
    case 'kick': return kickDoor();
    case 'loot': return loot();
    case 'fight': return fightNow();
    case 'flee': return fleeCombat();
    case 'end': return endTurn((a.give || []).map(u => p.hand.find(x => x.uid === u)).filter(Boolean));
    case 'discard': return doDiscard(p, c);
    case 'rc2hand': { p[c.kind === 'race' ? 'raceCard' : 'clsCard'] = null; giveCard(p, c); log(`${nameTag(p)} знімає ${c.kind === 'race' ? 'расу' : 'клас'} «${esc(c.name)}» і повертає карту в руку.`); syncSeat(p); return; }
    case 'help': return askHelp(a.target, { tr: a.tr | 0, cards: (a.cards || []).map(u => p.hand.find(x => x.uid === u)).filter(Boolean) });
    case 'trouble': return lookForTrouble(c);
    case 'equip': return doEquip(p, c);
    case 'unequip': return unequip(p, c);
    case 'sell': return doSell(p, c);
    case 'rc': return doPlayRC(p, c);
    case 'droprc': { p[c.kind === 'race' ? 'raceCard' : 'clsCard'] = null; discard(c); log(`${nameTag(p)} скидає ${c.kind === 'race' ? 'расу' : 'клас'} «${esc(c.name)}» у скид.`); syncSeat(p); return; }
    case 'levelup': return doLevelUp(p, c);
    case 'curse': return doCurse(p, c, G.players[a.target]);
    case 'shot': return playIntoCombat(p, c, a.side);
    case 'mod': return playIntoCombat(p, c, 'mon');
    case 'smoke': return playSmoke(p, c);
    case 'wizard': return wizardDiscard(p, c);
    case 'undead': return addMonster(p, c, null);
    case 'wander': return addMonster(p, p.hand.find(x => x.uid === a.mon), c);
    case 'redirect': return redirectCombat(p, c, G.players[a.target]);
    case 'trade': return doTrade(p, G.players[a.target], (a.give || []).map(u => findTradeItem(p, u)).filter(Boolean));
  }
}

function cardActions(c, where, v = viewerP()) {
  if (!v || !c || c.hidden) return [];
  const p = cur(), cb = G.combat, inCombat = G.phase === 'combat' && !!cb;
  const myTurn = v === p, free = !G.busy && !G.over, win = !!G.window && G.window.humans.includes(v);
  const isFighter = inCombat && v === fighter(), isHelper = inCombat && cb.helper === v.idx;
  const combatOk = inCombat && (free || win);
  const acts = [];
  const A = (label, act, extra = {}) => acts.push({ label, act, ...extra });
  const sell = () => { if (free && myTurn && !inCombat && c.value) A(`Продати за ${c.value} зол.`, { k: 'sell', uid: c.uid }); };
  if (where === 'gear') {
    if (c.kind === 'race' || c.kind === 'class') { if (free && !inCombat) { A('Зняти в руку', { k: 'rc2hand', uid: c.uid }); A('Скинути в скид', { k: 'droprc', uid: c.uid }); } return acts; }
    if (free && !inCombat) A('Зняти в руку', { k: 'unequip', uid: c.uid });
    sell(); return acts;
  }
  if (where !== 'hand') return acts;
  const undeadIn = inCombat && cb.mons.some(x => x.c.undead);
  const fp = fighter();
  switch (c.kind) {

function dockActs(v) {

    const fp = fighter(); if (v !== fp) return acts;
    const s = sides(), cb = G.combat;

    acts.push({ label: 'Покликати на поміч', fn: openHelp, dis: cb.helper != null || G.players.every(q => q === fp || cb.asked.has(q.idx)) });
    acts.push({ label: 'Тікати', act: { k: 'flee' }, cls: 'danger' });
    return acts;
  }
  if (v !== p) return acts;
  if (G.phase === 'start') acts.push({ label: 'Вибити двері', act: { k: 'kick' }, cls: 'primary pulse' });
  if (G.phase === 'afterKick') acts.push({ label: 'Обшукати кімнату', act: { k: 'loot' }, cls: 'primary' });
  if (G.phase === 'charity') acts.push({ label: v.hand.length > handLimit(v) ? 'Завершити хід…' : 'Завершити хід', act: { k: 'end' }, pick: true, cls: 'primary' });
  if (canTrade(v)) acts.push({ label: 'Обмін…', fn: openTrade });

}

    if (setHTML($('#hand'), `<div class="hand-cover"><div class="backs" aria-hidden="true">${'<i></i>'.repeat(5)}</div><div><p class="empty" style="padding:0 0 8px">Карти приховано, щоб ніхто не підглядав. Відкрий лише свої:</p><div class="row" style="margin:0">${others.map(h => `<button class="btn small" type="button" data-reveal="${h.idx}"><b style="color:${h.color}">${esc(h.name)}</b> · показати мої карти</button>`).join('')}</div></div></div>`)) $('#hand').querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => revealFor(G.players[+b.dataset.reveal]));
    return;
  }
  if (privacy() && v !== cur()) { const c0 = cur(); if (!G.window && c0 && c0.type === 'human') $('#status').innerHTML += ` Потім сховай карти — хід за <b>${esc(c0.name)}</b>.`; const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Сховати карти'; b.onclick = hideHand; box.appendChild(b); }
  $('#strText').textContent = `${v.name} · сила ${baseStr(v)}`;
  setHTML($('#equip'), dollHTML(v, false) + `<button class="btn small char-btn" type="button" data-sheet>Картка персонажа · сила ${baseStr(v)} · втеча +${fleeBonus(v)}</button>`);
  { const lim = handLimit(v), n = v.hand.length; setHTML($('#handOwner'), `${esc(v.name)} · <span class="hc${n > lim ? ' over' : ''}" title="Ліміт руки: ${lim}. Зайві карти доведеться віддати в кінці ходу.">${n} з ${lim}</span> ${plural(lim, 'карти', 'карт', 'карт')}${n > lim ? ' — забагато, зайві віддаси в кінці ходу' : ''}`); }
  const nowT = performance.now(); G.fresh.forEach(u => { if (!freshT[u]) freshT[u] = nowT + 700; }); G.fresh.clear();
  setHTML($('#hand'), v.hand.map(c => cardHTML(c, (freshT[c.uid] > nowT ? 'fresh ' : '') + (cardActions(c, 'hand').some(a => !a.dis && !/^(Продати|Скинути)/.test(a.label)) ? 'playable' : ''))).join('') || '<div class="empty">Рука порожня.</div>');
  G.fresh.clear();
}
function renderCombat() {
  const el = $('#combat'); const cb = G.combat;
  if (!cb || G.phase !== 'combat') { el.hidden = true; return; }
  const s = sides(), p = fighter(), h = cb.helper != null ? G.players[cb.helper] : null;
  const tr = treasureCount(), gain = levelsGain();
  const mods = [...cb.mods, ...cb.mShots].map(c => `<span class="tag m">${esc(c.name)} ${sgn(c.bonus)}</span>`)
    .concat(cb.pShots.map(c => `<span class="tag h">${esc(c.name)} ${sgn(c.bonus)}</span>`))
    .concat(cb.wiz ? [`<span class="tag h">Магія +${cb.wiz * 2}</span>`] : [])
    .concat(h ? [`<span class="tag h">${esc(h.name)} +${baseStr(h)}${cb.offer ? ` · обіцяно ${cb.offer.tr} ${plural(cb.offer.tr, 'скарб', 'скарби', 'скарбів')}` : ''}</span>`] : []);
  if (cb.mons.length > 1) mods.unshift(...cb.mons.map(x => `<span class="tag m">${x.c.art} ${esc(x.c.name)} ${monLvl(x.c, p)}${x.c.undead ? ' · 💀 нежить' : ''}</span>`));
  if (epicFor(p)) mods.unshift(`<span class="tag m">Епічна зона: рівень монстрів ×2</span>`);
  cb.mons.forEach(x => { const vb = vsBonus(x.c, p); if (vb) mods.push(`<span class="tag m">${esc(x.c.name)}: бонус проти тебе +${vb}</span>`); });
  if (cb.mons.some(x => x.c.undead) && (cls(p) === 'cleric' || (h && cls(h) === 'cleric'))) mods.push('<span class="tag h">Жрець проти нежиті +3</span>');
  const localOthers = NET.role !== 'client' && G.players.some(q => q.type === 'human' && q !== p && q.idx !== cb.helper);
  const canMeddle = localOthers && !G.over && (!G.busy || G.window) && G.players.filter(q => q.type === 'human').length > 1;
  const pct = Math.round(s.hero / (s.hero + s.mon) * 100);
  const bad = cb.mons.length > 1 ? `${cb.mons.length} монстри — тікати доведеться від кожного окремо` : cb.mons[0].c.bad.text;
  el.innerHTML = `<div class="cside hero"><div class="cl">${esc(p.name)}${h ? ' + ' + esc(h.name) : ''}</div><div class="big">${s.hero}</div></div>
    <div class="vs">${s.win ? 'перемагає' : 'програє'}<b>⚔</b></div>
    <div class="cside mon"><div class="cl">${esc(monNames())}</div><div class="big">${s.mon}</div></div>
    <div class="cbar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    ${mods.length ? `<div class="cmods">${mods.join('')}</div>` : ''}
    <div class="cnote">Нагорода: <b>${tr} ${plural(tr, 'скарб', 'скарби', 'скарбів')}, +${gain} ${plural(gain, 'рівень', 'рівні', 'рівнів')}</b> · Халепа: <b>${esc(bad)}</b>${s.tie && s.hero === s.mon ? ' · Нічия на користь воїна' : ''}</div>
    ${G.window ? `<div class="cnote" style="color:var(--brass)">Чекаємо рішення: <b>${waitingOn().map(h => esc(h.name)).join(', ') || '…'}</b>. Бій не завершиться, доки кожен не зіграє карту або не натисне «Не втручаюсь».</div>` : ''}
    ${canMeddle ? '<div class="crow"><button class="btn small" type="button" id="meddle">Втрутитися (інші гравці тут)</button></div>' : ''}`;
  el.hidden = false;
  const m = $('#meddle'); if (m) m.onclick = openInterfere;
}
function renderUI() { renderPlayers(); renderDock(); renderCombat(); queueSnap(); }

/* --- делеговані обробники --- */
$('#hand').addEventListener('click', e => { const el = e.target.closest('.card'); if (!el || !handVisible()) return; const v = viewerP(); const c = v && v.hand.find(x => x.uid === +el.dataset.uid); if (c) openCardMenu(c, 'hand'); });
$('#hand').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const el = e.target.closest('.card'); if (!el) return; e.preventDefault(); el.click(); });
$('#equip').addEventListener('click', e => { if (!handVisible()) return; if (e.target.closest('[data-sheet]')) { if (G.viewer >= 0) openCharSheet(G.viewer); return; } const b = e.target.closest('[data-g]'); if (!b) return; const v = viewerP(); const uid = +b.dataset.g; const c = v && [v.raceCard, v.clsCard, ...v.gear].find(x => x && x.uid === uid); if (c) openCardMenu(c, 'gear'); });
$('#btnRules').onclick = openRules;
$('#btnSkin').onclick = () => openSkins();
$('#btnSound').onclick = openSound; soundLabel();
document.querySelector('.dock .lbl [data-sheet]').onclick = () => { if (G.viewer >= 0 && handVisible()) openCharSheet(G.viewer); };
$('#players').addEventListener('click', e => { const c = e.target.closest('[data-p]'); if (c) openCharSheet(+c.dataset.p); });
$('#players').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const c = e.target.closest('[data-p]'); if (c) { e.preventDefault(); openCharSheet(+c.dataset.p); } });
$('#btnLog').onclick = () => { const l = $('#log'); l.hidden = !l.hidden; };
$('#btnLogClose').onclick = () => { $('#log').hidden = true; };
$('#btnNew').onclick = () => { if (NET.role === 'client') { toast('Нову партію запускає господар кімнати.'); return; } if (!G.busy || G.over || G.phase === 'setup') openSetup(); else { G.pendingSetup = true; toast('Нова гра почнеться після цього ходу'); } };
addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); } });
if (innerWidth < 760) $('#log').hidden = true;

/* ============================== СТАРТ ============================== */
async function boot() {
  try {
    const arts = [...buildDoorDeck(true), ...buildTreasureDeck()].map(c => c.art).join('') + '⚔♂♀★';
    await Promise.race([Promise.all(['32px Underdog', '22px Pangolin', '700 20px Rubik'].map(f => document.fonts.load(f, 'АБВ')).concat([document.fonts.load('40px "Noto Color Emoji"', arts)])), wait(4000)]);
  } catch (e) { /* шрифти недоступні — використовуємо запасні */ }
  if (typeof THREE === 'undefined') { $('#status').textContent = 'Не вдалося завантажити 3D-рушій. Перевір зʼєднання й онови сторінку.'; return; }
  init3D();
  renderUI();
  openSetup();
}
boot();
})();
</script>
</body>
